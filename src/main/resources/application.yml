spring:
  application:
    name: Restaurante
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/restaurant}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "3"
    url: ${DB_URL:jdbc:postgresql://localhost:5432/restaurant}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: none
    # Set SHOW_SQL=false in production environment variables
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        "[format_sql]": ${SHOW_SQL:true}
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Global batch-fetch size: Hibernate will load collections in groups
        # of this size instead of one query per entity — major N+1 reduction
        "[default_batch_fetch_size]": 25
        # Batch inserts/updates for better write performance
        jdbc:
          "[batch_size]": 25
          order_inserts: true
          order_updates: true

server:
  port: ${SERVER_PORT:8080}

# Logging configuration
logging:
  file:
    name: backend.log
  level:
    com.restaurante.backend: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.cors: DEBUG

# CORS: comma-separated list of allowed frontend origins
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://*.localhost:4200}
  jwt:
    secret: ${JWT_SECRET:my-super-secret-key-change-in-production-must-be-at-least-32-chars}
